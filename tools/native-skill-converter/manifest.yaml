version: 1

defaults:
  source_root: src/workflows
  snapshot_root: tools/native-skill-converter/snapshots
  standard_profile: cis-legacy-workflow-to-native-skill
  fail_closed: true

workflows:
  - id: design-thinking
    status: seeded-reference
    canonical_skill_id: bmad-cis-design-thinking
    source_dir: src/workflows/design-thinking
    target_dir: src/workflows/bmad-cis-design-thinking
    profile: cis-legacy-workflow-to-native-skill
    legacy_inventory:
      workflow_file: workflow.yaml
      instructions_file: instructions.md
      template_file: template.md
      data_files:
        - design-methods.csv
      extra_files:
        - README.md
    preserve_files:
      - source: design-methods.csv
        target: resources/design-methods.csv
      - source: template.md
        target: resources/template.md
    create_files:
      - SKILL.md
      - resources/bmad-skill-manifest.yaml
    delete_legacy_files:
      - README.md
      - instructions.md
      - workflow.yaml
    agent_target:
      file: src/agents/design-thinking-coach.agent.yaml
      before_key: workflow
      before_value: "{project-root}/_bmad/cis/workflows/design-thinking/workflow.yaml"
      after_key: exec
      after_value: "{project-root}/_bmad/cis/workflows/bmad-cis-design-thinking/SKILL.md"
    module_help:
      file: src/module-help.csv
      row_code: DT
      before_workflow_file: _bmad/cis/workflows/design-thinking/workflow.yaml
      after_workflow_file: skill:bmad-cis-design-thinking
    allowlisted_repo_refs:
      - AGENTS.md
      - src/workflows/README.md
    seeded_snapshot:
      file: tools/native-skill-converter/snapshots/design-thinking.yaml
      before_ref: origin/main
      before_commit: 131768fbf9b843ce8dfd2ed75556f366eb3e6d9d
      after_label: design-thinking-simple-skill

